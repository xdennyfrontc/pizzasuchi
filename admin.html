<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админ-панель — PizzaSushiWrot</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/logo.png">
</head>
<body>
  <header class="header">
    <a class="logo" href="index.html"><img src="img/logo.png" alt="">PizzaSushiWrot</a>
    <div class="header-right">
      <button class="btn" id="themeBtn" onclick="toggleTheme(event)" title="Тёмная / светлая тема"></button>
      <a class="btn" href="index.html">На сайт</a>
    </div>
  </header>

  <main class="content" style="margin-top:16px">
    <h2>Добавить товар</h2>
    <div class="form">
      <input id="pId" type="number" min="1" placeholder="ID = место в меню (пусто = в конец)">
      <input id="pName" placeholder="Название">
      <input id="pDesc" placeholder="Описание">
      <input id="pPrice" type="number" placeholder="Цена, ₽">
      <input id="pOld" type="number" placeholder="Старая цена, ₽ (для скидки, можно пусто)">
      <input id="pImage" placeholder="Фото: img/???.webp или ссылка (можно пусто)">
      <select id="pCat"></select>
      <button class="btn btn-main" onclick="addProduct()">Добавить</button>
    </div>

    <h2>Товары</h2>
    <table id="productsTable"></table>
    <h2>Пользователи</h2>
    <table id="usersTable"></table>
    <h2>Заказы</h2>
    <table id="ordersTable"></table>

        <!-- Плашка отмены удаления -->
    <div class="undo" id="undoBar" style="display:none">
      <span id="undoText"></span>
      <button class="btn btn-main" onclick="undoDelete()">↩ Отменить</button>
    </div>
  </main>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
